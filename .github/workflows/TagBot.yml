# This workflow is managed by gh actions-lock.

name: TagBot
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      lookback:
        default: 3
permissions:
  actions: read
  contents: write
  issues: read
  pull-requests: read
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: JuliaRegistries/TagBot@v1.25.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
